services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      INFISICAL_ENV: ${INFISICAL_ENV:-local}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID is required}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID is required}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET is required}
      APP_NAME: ${APP_NAME:-Vetpedia}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/app-data/vetpedia.sqlite}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MEMCACHED_HOST: ${MEMCACHED_HOST:-127.0.0.1}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Vetpedia}
      VITE_APP_NAME: ${VITE_APP_NAME:-Vetpedia}
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8000}
      VITE_NO_INDEX: ${VITE_NO_INDEX:-true}
      VETPEDIA_ALLOW_UNAPPROVED_SEARCH: ${VETPEDIA_ALLOW_UNAPPROVED_SEARCH:-false}
      VETPEDIA_SUPERADMIN_NAME: ${VETPEDIA_SUPERADMIN_NAME:?VETPEDIA_SUPERADMIN_NAME is required}
      VETPEDIA_SUPERADMIN_EMAIL: ${VETPEDIA_SUPERADMIN_EMAIL:?VETPEDIA_SUPERADMIN_EMAIL is required}
      VETPEDIA_SUPERADMIN_PASSWORD: ${VETPEDIA_SUPERADMIN_PASSWORD:?VETPEDIA_SUPERADMIN_PASSWORD is required}
      VETPEDIA_ADMIN_NAME: ${VETPEDIA_ADMIN_NAME:?VETPEDIA_ADMIN_NAME is required}
      VETPEDIA_ADMIN_EMAIL: ${VETPEDIA_ADMIN_EMAIL:?VETPEDIA_ADMIN_EMAIL is required}
      VETPEDIA_ADMIN_PASSWORD: ${VETPEDIA_ADMIN_PASSWORD:?VETPEDIA_ADMIN_PASSWORD is required}
      VETPEDIA_DUMMY_USER_PASSWORD: ${VETPEDIA_DUMMY_USER_PASSWORD:?VETPEDIA_DUMMY_USER_PASSWORD is required}
      SCOUT_DRIVER: ${SCOUT_DRIVER:-database}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-local-development-typesense-key}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
      TYPESENSE_PROTOCOL: ${TYPESENSE_PROTOCOL:-http}
    volumes:
      - ./:/app
      - ./.docker/data:/app-data
      - vendor_data:/app/vendor
      - node_modules_data:/app/node_modules
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      typesense:
        condition: service_healthy
    networks:
      - vetpedia
    tty: true

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-local-development-typesense-key}
      TYPESENSE_ENABLE_CORS: true
    volumes:
      - typesense_data:/data
    command: ""
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8108'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetpedia

volumes:
  vendor_data:
  node_modules_data:
  caddy_data:
  caddy_config:
  typesense_data:

networks:
  vetpedia:
    name: vetpedia-fphp
